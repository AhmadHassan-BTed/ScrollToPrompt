<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 200px;
            padding: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            color: #333;
        }
        h2 {
            font-size: 16px;
            margin-top: 0;
            color: #4a9eff;
        }
        p {
            font-size: 12px;
            line-height: 1.4;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <h2>ScrollToPrompt</h2>
    <p>Visual markers for your prompts in AI chats.</p>
    <div class="status">
        <div class="status-dot"></div>
        <span>Active</span>
    </div>
</body>
</html>
