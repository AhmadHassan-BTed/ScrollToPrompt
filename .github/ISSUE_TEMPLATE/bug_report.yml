name: Bug report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - ChatGPT
        - Claude
        - Gemini
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Bug Context
      description: Can you provide a link to the page or a screenshot?
